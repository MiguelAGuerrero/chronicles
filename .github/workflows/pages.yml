name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the loop's commit check reads every commit of the push, however long
          # (records audit 25), and the record gate's cut-over reads the commits' ancestry.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The agent docs: AGENTS.md's budget, rule globs, named paths (scripts/check-docs.js).
      - run: npm run check:docs
      # The vision's mechanical half: score words, tallies, hosts, dependencies, spec verdicts (decision 0094).
      - run: npm run check:vision
      # The tending loop's limits, held outside the loop (decision 0133): every `tend …` commit in this push
      # carries its own named test and a Source line and touches nothing the loop may not, and changes the
      # record documents only by its declared operations (decision 0156). The check runs as the push's base
      # had it, so no commit of the push can loosen the scripts that judge it (records audit 19).
      - name: Loop commits keep to the loop's limits
        if: github.event_name == 'push'
        run: |
          if [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::a new branch: no base to read the push from; loop commits not checked"
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if [ "${FORCED}" = "true" ]; then
              echo "::notice::a forced push whose base ${BEFORE} is gone; loop commits not checked"
            else
              echo "::error::the push's base BEFORE (${BEFORE}) is not in the history: the loop's commits cannot be read"
              exit 1
            fi
          else
            gate="$(mktemp -d)"
            # The base's scripts once it holds the gate (and the TEND_ROOT that lets them read this checkout).
            if git show "${BEFORE}:scripts/records.js" 2>/dev/null | grep -q 'Records-Op' \
              && git show "${BEFORE}:scripts/tend.js" 2>/dev/null | grep -q 'TEND_ROOT'; then
              git archive "${BEFORE}" scripts | tar -x -C "${gate}"
            else
              cp -R scripts "${gate}/"
            fi
            TEND_ROOT="${PWD}" node "${gate}"/scripts/tend.js commits --loop-only "${BEFORE}..${GITHUB_SHA}"
          fi
        env:
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
      - run: npm run typecheck
      - run: npm test
      # Lint holds the import boundaries and the functional core's layers (FC3, FC5).
      - run: npm run lint
      - name: Export for /chronicles
        run: npx expo export --platform web
        env:
          CHRONICLES_BASE_URL: /chronicles
      # fix stale-chunk audit 1: one JS file. A deploy replaces every file, so a page left open across it
      # loses any file it hasn't loaded yet: a split route or import() showed "Loading module ... failed".
      - name: The web export is one bundle
        run: |
          n=$(find dist/_expo/static/js/web -name '*.js' | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "::error::the web export wrote $n JS files; an open page loses all but the one it loaded to the next deploy (fix stale-chunk)"
            find dist/_expo/static/js/web -name '*.js'
            exit 1
          fi
      # Pages has no fallback for app routes: serve the app for unknown paths,
      # so a reload on /chronicles/walk resumes the walk instead of a 404.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
