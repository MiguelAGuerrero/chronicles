<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recording bar at 320 px, the words on their own line</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@font-face{font-family:"Ionicons";src:url("/_blob/c562b67125719f94a798185bd81d240c") format("truetype");}
a{color:#1d2430}a:hover{color:#596273}
</style>
</helmet>
<div style="width: 320px; height: 700px; position: relative; overflow: hidden; background: #f4f2ee; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<img src="/_blob/b43a1b5d098184cc9067bf028660d024" alt="" aria-hidden="true" style="width: 320px; height: 700px; display: block;">
<div style="position: absolute; left: 0; right: 0; top: 540px; box-sizing: border-box; background: #1d2430; padding: 6px 10px 6px 6px; display: flex; flex-direction: column; gap: 6px;">
<p role="status" style="margin: 0; padding: 4px 10px 0; color: #ffffff; font-size: 14px; font-weight: 600; line-height: 19px;">A voice memo is recording. Save it first.</p>
<div style="display: flex; flex-direction: row; align-items: center; gap: 6px;">
<button aria-label="Recording voice memo, 7 seconds. Saves it and returns to the walk" style="all: unset; flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; padding: 0 10px; display: flex; flex-direction: row; align-items: center; gap: 8px; cursor: pointer;">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #b42318; flex-shrink: 0;"></span>
<span style="flex: 1; min-width: 0; color: #ffffff; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;">0:07</span>
</button>
<button aria-label="Discard voice memo" style="all: unset; width: 44px; height: 44px; border-radius: 22px; background: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;"><span aria-hidden="true" style="font-family: Ionicons; font-size: 22px; color: #1d2430; line-height: 22px;">&#xf5f6;</span></button>
<button aria-label="Stop and save voice memo" style="all: unset; width: 44px; height: 44px; border-radius: 22px; background: #6b21a8; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;"><span aria-hidden="true" style="font-family: Ionicons; font-size: 22px; color: #ffffff; line-height: 22px;">&#xf59e;</span></button>
<span aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0;"></span>
<button aria-label="Hold to stop the walk" style="all: unset; width: 44px; height: 44px; border-radius: 22px; background: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;"><span aria-hidden="true" style="font-family: Ionicons; font-size: 18px; color: #1d2430; line-height: 18px;">&#xf59e;</span></button>
</div>
</div>
</div>
</x-dc>

</html>
